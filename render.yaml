services:
  - type: web
    name: bharat-wealth-backend
    plan: free
    runtime: docker
    dockerfilePath: ./bankend/Dockerfile
    dockerContext: ./bankend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUDIT_HMAC_KEY
        generateValue: true
      - key: ML_SERVICE_URL
        value: https://bharat-wealth-ml.onrender.com
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: web
    name: bharat-wealth-ml
    plan: free
    runtime: docker
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    envVars:
      - key: BACKEND_URL
        value: https://bharat-wealth-backend.onrender.com
      - key: FRONTEND_URL
        value: https://bharataiwealth-blush.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
