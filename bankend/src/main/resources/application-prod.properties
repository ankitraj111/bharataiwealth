# ==================== Production Profile ====================
# This file overrides application.properties when SPRING_PROFILES_ACTIVE=prod

# Force SSL for Render PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:wealthdb}?sslmode=require
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Hikari - more patient timeouts for Render free-tier cold starts
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.sslmode=require

# Flyway - retry on connection failures (handles Render cold starts)
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=10

# Tighter logging in prod
logging.level.com.bharatai.wealth=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
