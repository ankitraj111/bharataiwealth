# Bharat AI Wealth Backend
spring.application.name=bharat-ai-wealth
server.port=8080

# PostgreSQL Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wealthdb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET:BharatAIWealthSecretKey2026SuperSecureTokenForAuthenticationPurposes}
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000,https://ankitraj111.github.io

# Logging
logging.level.com.bharatai.wealth=DEBUG
logging.level.org.springframework.security=DEBUG

# Allow circular references if absolutely necessary (but we'll try to fix it properly)
spring.main.allow-circular-references=true
