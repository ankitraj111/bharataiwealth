# Bharat AI Wealth Backend
spring.application.name=bharat-ai-wealth
server.port=8080

# PostgreSQL Database
# Note: Constructing URL from individual parts to ensure 'jdbc:' prefix and correct driver compatibility
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wealthdb}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling & SSL (Render PostgreSQL requires SSL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSL_MODE:prefer}


# ==================== JPA Configuration ====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==================== Flyway Database Migrations ====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ==================== JWT Configuration ====================
jwt.secret=${JWT_SECRET:BharatAIWealthSecretKey2026SuperSecureTokenForAuthenticationPurposesMinimum32Chars}
jwt.expiration=3600000
jwt.refresh-expiration=604800000
jwt.mfa-temp-expiration=300000

# ==================== API Key Configuration ====================
api.key.header=X-API-Key
api.key.ml-service=${ML_SERVICE_API_KEY:}

# ==================== Audit Configuration ====================
audit.hmac-key=${AUDIT_HMAC_KEY:BharatAIWealthAuditKey2026SecureHMACKeyForIntegrityVerification}

# ==================== Bank-Level Security Configuration ====================
# Encryption master key (AES-256) - MUST be set in production
encryption.master-key=${ENCRYPTION_MASTER_KEY:}

# Transaction security
transaction.timeout-seconds=300
transaction.max-amount=10000000

# Fraud detection thresholds
fraud.high-risk-threshold=70
fraud.medium-risk-threshold=40
fraud.unusual-time-start=2
fraud.unusual-time-end=5

# ==================== CORS ====================
cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://ankitraj111.github.io,https://bharat-wealth-backend.onrender.com,https://bharat-wealth-ml.onrender.com,https://bharataiwealth.onrender.com,https://bharataiwealth-blush.vercel.app,https://*.vercel.app

# ==================== Logging (with Correlation ID) ====================
logging.level.com.bharatai.wealth=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId:-no-req}] %-5level %logger{36} - %msg%n

# ==================== Async Configuration ====================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10

# ==================== Performance/Compression ====================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ==================== Jackson Configuration ====================
# Serialize dates as ISO-8601 strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ==================== Resilience4j Circuit Breaker ====================
resilience4j.circuitbreaker.instances.mlService.register-health-indicator=true
resilience4j.circuitbreaker.instances.mlService.sliding-window-size=10
resilience4j.circuitbreaker.instances.mlService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mlService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.mlService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mlService.sliding-window-type=COUNT_BASED

resilience4j.retry.instances.mlService.max-attempts=2
resilience4j.retry.instances.mlService.wait-duration=500ms

# ==================== OpenAPI / Swagger ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

