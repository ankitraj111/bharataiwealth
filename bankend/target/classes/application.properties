# Bharat AI Wealth Backend
spring.application.name=bharat-ai-wealth
server.port=8080

# PostgreSQL Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wealthdb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================== JPA Configuration ====================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==================== Flyway Database Migrations ====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ==================== JWT Configuration ====================
jwt.secret=${JWT_SECRET:BharatAIWealthSecretKey2026SuperSecureTokenForAuthenticationPurposesMinimum32Chars}
jwt.expiration=3600000
jwt.refresh-expiration=604800000
jwt.mfa-temp-expiration=300000

# ==================== Audit Configuration ====================
audit.hmac-key=${AUDIT_HMAC_KEY:BharatAIWealthAuditKey2026SecureHMACKeyForIntegrityVerification}

# ==================== CORS ====================
cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://ankitraj111.github.io

# ==================== Logging ====================
logging.level.com.bharatai.wealth=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==================== Async Configuration ====================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
