name: Backend Keep Alive

on:
  schedule:
    # Run every 14 minutes (Render free tier sleeps after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "Pinging Bharat AI Backend..."
          curl -s -f https://bharat-wealth-backend.onrender.com/api/health || echo "Backend is still warming up..."
